[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rolloutplane-viz"
version = "0.3.0"
description = "Research visualization for RolloutPlane."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "rolloutplane @ git+https://github.com/WASlab/RolloutPlane.git@41b585e5111e5087251ee24ec54c3e96712aeff7",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.14,<1",
]

[project.scripts]
rolloutplane-viz = "rolloutplane_viz.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rolloutplane_viz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rolloutplane_viz"]
