name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: RolloutPlaneViz
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --locked
        working-directory: RolloutPlaneViz/backend
      - run: uv run ruff check .
        working-directory: RolloutPlaneViz/backend
      - run: uv run ruff format --check .
        working-directory: RolloutPlaneViz/backend
      - run: uv run mypy --no-incremental
        working-directory: RolloutPlaneViz/backend
      - run: uv run pytest
        working-directory: RolloutPlaneViz/backend
      - run: uv build
        working-directory: RolloutPlaneViz/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: RolloutPlaneViz
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: RolloutPlaneViz/frontend/package-lock.json
      - run: npm ci
        working-directory: RolloutPlaneViz/frontend
      - run: npm run typecheck
        working-directory: RolloutPlaneViz/frontend
      - run: npm run build
        working-directory: RolloutPlaneViz/frontend
